server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server. Using a variable in proxy_pass (below)
  # forces nginx to resolve "backend" at request time via this resolver,
  # instead of once at startup, which would fail nginx entirely if the
  # backend container isn't registered in DNS yet at that exact moment.
  resolver 127.0.0.11 valid=10s;

  # Same-origin API: the browser only ever talks to this one port,
  # nginx forwards /bookings requests to the backend container.
  location /bookings {
    set $backend http://backend:3333;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router client-side routes (e.g. /future, /my-bookings) must
  # fall back to index.html on a hard refresh.
  location / {
    try_files $uri /index.html;
  }
}
