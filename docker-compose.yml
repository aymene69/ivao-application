services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: file:./dev.db
      PORT: "3333"
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - backend_data:/app/prisma
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  backend_data:
